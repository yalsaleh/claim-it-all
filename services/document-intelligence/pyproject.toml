[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "contractradar-document-intelligence"
version = "0.2.0"
description = "Document ingestion workers and deterministic extractors for ContractRadar"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "arq==0.26.1",
  "redis==5.2.1",
  "boto3==1.40.2",
  "asyncpg==0.30.0",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "charset-normalizer==3.4.1",
  "pillow==11.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.8.6",
  "mypy==1.14.1",
  "types-redis==4.6.0.20241004",
  "boto3-stubs[s3]==1.40.2",
]

[project.scripts]
contractradar-di-api = "document_intelligence.main:run"
contractradar-di-worker = "document_intelligence.workers:run_worker"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP006", "UP035"]

[tool.mypy]
# Keep in sync with CI (.github/workflows/ci.yml Setup Python = 3.12).
# Using 3.9 here makes mypy follow 3.12-installed deps (e.g. click match syntax)
# and fail with exit code 2 on GitHub Actions while local 3.9 venvs stay green.
python_version = "3.12"
strict = true
packages = ["document_intelligence"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "arq",
  "arq.*",
  "asyncpg",
  "asyncpg.*",
  "boto3",
  "botocore.*",
  "charset_normalizer",
  "docx",
  "docx.*",
  "openpyxl",
  "openpyxl.*",
  "pypdf",
  "pypdf.*",
  "PIL",
  "PIL.*",
]
ignore_missing_imports = true
