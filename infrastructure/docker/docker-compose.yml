# ContractRadar local data plane — Slice 2B
# From repo root:
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build
#   docker compose -f infrastructure/docker/docker-compose.yml ps
#   docker compose -f infrastructure/docker/docker-compose.yml down -v
#
# Storage layout (single private bucket, prefix-separated — ADR-020):
#   tenants/{tenantId}/projects/{projectId}/quarantine/...
#   tenants/{tenantId}/projects/{projectId}/originals/...
#   tenants/{tenantId}/projects/{projectId}/derived/...
#
# Credentials below are LOCAL-ONLY. Never use them in staging/production.

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: contractradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractradar
      POSTGRES_PASSWORD: contractradar
      POSTGRES_DB: contractradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractradar -d contractradar"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.4.2-alpine
    container_name: contractradar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: contractradar-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    container_name: contractradar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/contractradar-documents;
      mc anonymous set none local/contractradar-documents;
      mc version enable local/contractradar-documents || true;
      exit 0;
      "
    restart: "no"

  clamav:
    image: clamav/clamav:1.4.1-41
    container_name: contractradar-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || clamdscan --ping 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G

  document-intelligence:
    build:
      context: ../../services/document-intelligence
      dockerfile: Dockerfile
    image: contractradar-document-intelligence:local
    container_name: contractradar-document-intelligence
    restart: unless-stopped
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: dev-internal-token-change-me
      DATABASE_URL: postgresql://contractradar_app:contractradar@postgres:5432/contractradar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: contractradar-documents
      S3_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ALLOW_DEV_DEFAULTS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  document-intelligence-worker:
    image: contractradar-document-intelligence:local
    container_name: contractradar-di-worker
    restart: unless-stopped
    command: ["arq", "document_intelligence.workers.WorkerSettings"]
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: dev-internal-token-change-me
      DATABASE_URL: postgresql://contractradar_app:contractradar@postgres:5432/contractradar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: contractradar-documents
      S3_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ALLOW_DEV_DEFAULTS: "true"
    depends_on:
      document-intelligence:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  outbox-dispatcher:
    image: contractradar-document-intelligence:local
    container_name: contractradar-outbox-dispatcher
    restart: unless-stopped
    command: ["python", "-m", "document_intelligence.outbox.dispatcher"]
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: dev-internal-token-change-me
      DATABASE_URL: postgresql://contractradar_app:contractradar@postgres:5432/contractradar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: contractradar-documents
      S3_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ALLOW_DEV_DEFAULTS: "true"
      OUTBOX_POLL_SECONDS: "2"
    depends_on:
      document-intelligence:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
