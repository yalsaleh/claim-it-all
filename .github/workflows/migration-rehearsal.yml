name: Migration rehearsal

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: test
  APP_ENV: test
  DATABASE_URL: postgresql://contractradar_app:contractradar@localhost:5432/contractradar_test?schema=public
  DATABASE_MIGRATE_URL: postgresql://contractradar:contractradar@localhost:5432/contractradar_test?schema=public
  BETTER_AUTH_SECRET: ci-test-secret-with-sufficient-length-32
  APP_URL: http://localhost:3000
  ALLOW_DEV_DEFAULTS: 'true'
  MALWARE_SCANNER: fake_test
  DOCUMENT_INTELLIGENCE_URL: http://localhost:8000
  DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: ci-internal-token-32chars
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: contractradar-documents
  S3_FORCE_PATH_STYLE: 'true'
  BETTER_AUTH_URL: http://localhost:3000
  MIGRATION_OUT_DIR: ${{ github.workspace }}/artifacts/migration
  REQUIRE_INTEGRATION_DB: 'true'
  SLICE8_BASELINE_COMMIT: 0e6ff4e0c529b23ad7bde881b029079ef60e3ff4

jobs:
  migration-rehearsal:
    name: Slice 8→9 true checkout upgrade + drift + role separation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: contractradar
          POSTGRES_PASSWORD: contractradar
          POSTGRES_DB: contractradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractradar -d contractradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:prisma && pnpm db:generate
      - name: True Slice 8 (0e6ff4e) → current upgrade rehearsal
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          mkdir -p artifacts/migration
          chmod +x scripts/db/*.sh scripts/backup/lib.sh
          # Verify baseline object exists in full history
          git cat-file -t "${SLICE8_BASELINE_COMMIT}"
          bash scripts/db/slice8-upgrade-rehearsal.sh
          test -s artifacts/migration/slice8-to-slice9-report.json
          test -s artifacts/migration/baseline-commit.txt
          grep -q 0e6ff4e artifacts/migration/baseline-commit.txt
      - name: Drift detection
        run: |
          bash scripts/db/migration-drift-check.sh
          test -s artifacts/migration/migration-drift-report.json
      - name: Role separation
        run: |
          bash scripts/db/role-separation-check.sh
          test -s artifacts/migration/role-separation-report.json
          node scripts/ci/write-evidence-summary.mjs \
            "Migration rehearsal" PASS artifacts/migration \
            "checksExecuted=true-0e6ff4e-checkout-upgrade,drift-detection,role-separation" \
            "checksNotRun=" \
            "knownGaps="
      - uses: actions/upload-artifact@v6
        with:
          name: migration-rehearsal-artifacts
          path: artifacts/migration/
          if-no-files-found: error

  verify-artifacts:
    name: Verify migration artifact contents
    needs: migration-rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: migration-rehearsal-artifacts
          path: downloaded/migration
      - name: Validate archive contents
        run: |
          chmod +x scripts/ci/verify-uploaded-artifacts.sh
          mkdir -p artifacts/artifact-verification
          ARTIFACT_VERIFY_OUT_DIR="${{ github.workspace }}/artifacts/artifact-verification" \
            bash scripts/ci/verify-uploaded-artifacts.sh \
              downloaded/migration migration-rehearsal "${{ github.sha }}"
          test -s artifacts/artifact-verification/artifact-verification-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: migration-artifact-verification
          path: artifacts/artifact-verification/
          if-no-files-found: error
