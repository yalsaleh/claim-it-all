name: Migration rehearsal

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: test
  APP_ENV: test
  DATABASE_URL: postgresql://contractradar:contractradar@localhost:5432/contractradar_test?schema=public
  DATABASE_MIGRATE_URL: postgresql://contractradar:contractradar@localhost:5432/contractradar_test?schema=public
  BETTER_AUTH_SECRET: ci-test-secret-with-sufficient-length-32
  APP_URL: http://localhost:3000
  ALLOW_DEV_DEFAULTS: 'true'
  MALWARE_SCANNER: fake_test
  DOCUMENT_INTELLIGENCE_URL: http://localhost:8000
  DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: ci-internal-token-32chars
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: contractradar-documents
  S3_FORCE_PATH_STYLE: 'true'
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  migration-rehearsal:
    name: Clean migrate + Slice 8 upgrade path
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: contractradar
          POSTGRES_PASSWORD: contractradar
          POSTGRES_DB: contractradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractradar -d contractradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      # pnpm must be on PATH before setup-node@v5 (packageManager field triggers pnpm cache).
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:prisma && pnpm db:generate
      - name: Migrate from zero
        run: |
          chmod +x scripts/db/*.sh
          bash scripts/db/migrate-check.sh
          pnpm db:migrate:deploy
          bash scripts/db/migrate-verify.sh
      - name: Reset and remigrate
        run: |
          pnpm db:reset
          pnpm db:migrate:deploy
          pnpm db:seed
      - name: Assert Slice 9 tables exist
        run: |
          psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -c "\dt tenant_settings"
          psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -c "\dt backup_run"
          psql "$DATABASE_MIGRATE_URL" -v ON_ERROR_STOP=1 -c "\dt support_access_request"
