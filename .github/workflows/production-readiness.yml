name: Production readiness

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: test
  APP_ENV: test
  CONTRACTRADAR_ENV: CI
  CI: 'true'
  APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://contractradar_app:contractradar@localhost:5432/contractradar_test?schema=public
  INTEGRATION_DATABASE_URL: postgresql://contractradar_app:contractradar@localhost:5432/contractradar_test?schema=public
  DATABASE_MIGRATE_URL: postgresql://contractradar:contractradar@localhost:5432/contractradar_test?schema=public
  BETTER_AUTH_SECRET: ci-test-secret-with-sufficient-length-32
  BETTER_AUTH_URL: http://localhost:3000
  DOCUMENT_INTELLIGENCE_URL: http://localhost:8000
  DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: ci-internal-token-32chars
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: contractradar-documents
  S3_FORCE_PATH_STYLE: 'true'
  LOG_LEVEL: info
  ALLOW_DEV_DEFAULTS: 'true'
  MALWARE_SCANNER: clamav
  CLAMAV_HOST: 127.0.0.1
  CLAMAV_PORT: '3310'
  CONNECTOR_PROVIDER: fake
  NOTICE_DELIVERY_PROVIDER: fake
  PROD_EVIDENCE_OUT_DIR: ${{ github.workspace }}/artifacts/production-readiness
  SUPPLY_CHAIN_OUT_DIR: ${{ github.workspace }}/artifacts/supply-chain
  REQUIRE_INTEGRATION_DB: 'true'
  ARQ_QUEUE_NAME: contractradar:document-processing
  START_CLAMAV: 'true'

jobs:
  production-readiness:
    name: Production readiness evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: contractradar
          POSTGRES_PASSWORD: contractradar
          POSTGRES_DB: contractradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractradar -d contractradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Start MinIO + ClamAV sidecars
        run: |
          chmod +x scripts/ci/start-live-sidecars.sh scripts/ci/stop-live-sidecars.sh scripts/ci/sidecar-helpers.sh
          bash scripts/ci/start-live-sidecars.sh
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:prisma && pnpm db:generate
      - env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATE_URL }}
        run: pnpm db:migrate:deploy
      - env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATE_URL }}
        run: pnpm db:seed
      - run: pnpm --filter @contractradar/platform build
      - name: Config validation (CI class)
        run: |
          mkdir -p artifacts/production-readiness artifacts/supply-chain
          pnpm --filter @contractradar/web exec tsx scripts/production-validate.ts \
            | tee artifacts/production-readiness/config-validation.json
      - name: Reject fake providers in PRODUCTION class
        run: |
          set +e
          OUT=$(CONTRACTRADAR_ENV=PRODUCTION ALLOW_DEV_DEFAULTS=false \
            BETTER_AUTH_SECRET="$(python3 -c 'print("x"*48)')" \
            S3_ACCESS_KEY_ID=notdefault S3_SECRET_ACCESS_KEY=notdefaultsecret \
            DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN="$(python3 -c 'print("t"*40)')" \
            MALWARE_SCANNER=clamav CLAMAV_HOST=clamav COOKIE_SECURE=true \
            DATABASE_MIGRATE_URL=postgresql://migrator:x@localhost/db \
            DATABASE_URL=postgresql://contractradar_app:x@localhost/db \
            CONNECTOR_PROVIDER=fake \
            pnpm --filter @contractradar/web exec tsx scripts/production-validate.ts)
          STATUS=$?
          set -e
          echo "$OUT" | tee artifacts/production-readiness/production-fake-provider-rejection.json
          echo "$OUT" | grep -q CFG_FAKE_PROVIDER
          test "$STATUS" -ne 0
      - name: Test-purge safety (STAGING/PILOT/PRODUCTION fail closed)
        run: |
          chmod +x scripts/ci/test-purge-safety-check.sh
          bash scripts/ci/test-purge-safety-check.sh
          test -s artifacts/production-readiness/test-purge-safety-report.json
      - name: Supply-chain + vulnerability policy
        run: |
          chmod +x scripts/supply-chain/*.sh scripts/ci/*.sh
          bash scripts/supply-chain/secret-scan.sh
          bash scripts/supply-chain/sbom.sh
          bash scripts/supply-chain/license-inventory.sh
          pnpm security:audit
      - name: Integrity + migration verify
        run: |
          pnpm integrity:check | tee artifacts/production-readiness/integrity-check.json
          bash scripts/db/migrate-verify.sh | tee artifacts/production-readiness/migration-verify.txt
      - name: Pilot readiness fixture
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATE_URL }}
        run: |
          pnpm --filter @contractradar/web exec tsx scripts/pilot-readiness-fixture.ts \
            | tee artifacts/production-readiness/pilot-readiness-fixture.json
      - name: Full synthetic service readiness (ClamAV/worker/dispatcher)
        run: |
          chmod +x scripts/ci/full-service-readiness-check.sh
          bash scripts/ci/full-service-readiness-check.sh
          test -s artifacts/production-readiness/full-service-readiness-report.json
      - name: Web + DI production container build/inspect
        run: |
          chmod +x scripts/ci/web-container-hardening-check.sh
          bash scripts/ci/web-container-hardening-check.sh
          test -s artifacts/production-readiness/web-container-hardening-report.json
          test -s artifacts/production-readiness/container-hardening.json
      - name: Production build
        run: NODE_ENV=production pnpm build
      - name: Evidence summary
        run: |
          test -s artifacts/supply-chain/sbom.json
          test -s artifacts/supply-chain/vulnerability-policy.json
          test -s artifacts/production-readiness/config-validation.json
          test -s artifacts/production-readiness/container-hardening.json
          test -s artifacts/production-readiness/web-container-hardening-report.json
          test -s artifacts/production-readiness/test-purge-safety-report.json
          test -s artifacts/production-readiness/full-service-readiness-report.json
          test -s artifacts/production-readiness/pilot-readiness-fixture.json
          node scripts/ci/write-evidence-summary.mjs \
            "Production readiness" PASS artifacts/production-readiness \
            "checksExecuted=config-validate,fake-provider-reject,test-purge-safety,integrity,migration-verify,pilot-fixture,full-service-readiness,web-container-hardening,build,supply-chain" \
            "checksNotRun=live-external-apm,real-cloud-restore,kubernetes" \
            "knownGaps=mfa-architecture-only,break-glass-documented-only"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-readiness-evidence
          path: |
            artifacts/production-readiness/
            artifacts/supply-chain/
          if-no-files-found: warn
      - if: always()
        run: |
          for f in /tmp/di-api-pr.pid /tmp/arq-worker-pr.pid /tmp/outbox-pr.pid /tmp/di-pr.pid; do
            if [[ -f "$f" ]]; then kill "$(cat "$f")" 2>/dev/null || true; fi
          done
          bash scripts/ci/stop-live-sidecars.sh || true

  verify-artifacts:
    name: Verify production-readiness artifact contents
    needs: production-readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: production-readiness-evidence
          path: downloaded/production-readiness
      - name: Validate archive contents
        run: |
          chmod +x scripts/ci/verify-uploaded-artifacts.sh
          mkdir -p artifacts/artifact-verification
          ARTIFACT_VERIFY_OUT_DIR="${{ github.workspace }}/artifacts/artifact-verification" \
            bash scripts/ci/verify-uploaded-artifacts.sh \
              downloaded/production-readiness production-readiness "${{ github.sha }}"
          test -s artifacts/artifact-verification/artifact-verification-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: production-readiness-artifact-verification
          path: artifacts/artifact-verification/
          if-no-files-found: error
