name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

env:
  NODE_ENV: test
  APP_ENV: test
  APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://contractradar_app:contractradar@localhost:5432/contractradar_test?schema=public
  INTEGRATION_DATABASE_URL: postgresql://contractradar_app:contractradar@localhost:5432/contractradar_test?schema=public
  DATABASE_MIGRATE_URL: postgresql://contractradar:contractradar@localhost:5432/contractradar_test?schema=public
  BETTER_AUTH_SECRET: ci-test-secret-with-sufficient-length-32
  BETTER_AUTH_URL: http://localhost:3000
  DOCUMENT_INTELLIGENCE_URL: http://localhost:8000
  DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: ci-internal-token-32chars
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: contractradar-documents
  S3_FORCE_PATH_STYLE: "true"
  LOG_LEVEL: info
  REQUIRE_INTEGRATION_DB: "true"
  ALLOW_DEV_DEFAULTS: "true"
  MALWARE_SCANNER: fake_test
  SEED_OWNER_PASSWORD: "ChangeMe-Owner-2026!"
  SEED_VIEWER_PASSWORD: "ChangeMe-Viewer-2026!"

jobs:
  verify:
    name: Verify foundation + security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: contractradar
          POSTGRES_PASSWORD: contractradar
          POSTGRES_DB: contractradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractradar -d contractradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Start MinIO sidecar
        env:
          START_CLAMAV: "false"
        run: |
          chmod +x scripts/ci/start-live-sidecars.sh scripts/ci/stop-live-sidecars.sh
          bash scripts/ci/start-live-sidecars.sh

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: services/document-intelligence
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: pnpm format:check

      - name: Prisma validate + generate
        run: |
          pnpm validate:prisma
          pnpm db:generate

      - name: Migrate test database
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATE_URL }}
        run: pnpm db:migrate:deploy

      - name: Seed test database
        run: pnpm db:seed

      - name: Lint
        run: pnpm --filter @contractradar/shared lint && pnpm --filter @contractradar/authz lint && pnpm --filter @contractradar/web lint

      - name: Typecheck
        run: pnpm --filter @contractradar/shared typecheck && pnpm --filter @contractradar/authz typecheck && pnpm --filter @contractradar/web typecheck

      - name: Python lint + typecheck + unit/contract tests
        working-directory: services/document-intelligence
        env:
          APP_ENV: test
          MALWARE_SCANNER: fake_test
          DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: ci-internal-token-32chars
          ALLOW_DEV_DEFAULTS: "true"
        run: |
          ruff check src tests
          mypy src
          pytest -q -k "not live"

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration / security tests (no skips allowed)
        run: |
          set -euo pipefail
          OUTPUT=$(pnpm test:integration 2>&1 | tee /tmp/integration.out)
          if echo "$OUTPUT" | grep -E '[1-9][0-9]* skipped'; then
            echo "Security integration tests must not skip."
            exit 1
          fi
          echo "$OUTPUT" | grep -E 'Test Files|Tests '

      - name: Reset + remigrate + reseed (reproducibility)
        env:
          # migrate reset must use the bootstrap role (see DATABASE_MIGRATE_URL).
          DATABASE_URL: ${{ env.DATABASE_MIGRATE_URL }}
        run: |
          pnpm db:reset
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Build packages and web
        run: pnpm build

      - name: Stop MinIO sidecar
        if: always()
        run: bash scripts/ci/stop-live-sidecars.sh || true

      - name: Verification summary
        if: always()
        run: |
          echo "## Mode A / foundation CI"
          echo "- Postgres/Redis: GitHub service containers"
          echo "- MinIO: docker run sidecar (official image needs server /data; GHA services: cannot set command)"
          echo "- Unit + security integration (fail on skip): required"
          echo "- Python lint/type/unit (non-live): required"
          echo "- Live ClamAV/ARQ/full ingestion: see workflow live-ingestion.yml (Mode B)"
