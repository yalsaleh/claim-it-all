name: Live ingestion

# Mode B — authoritative Slice 2B operational verification.
# Runs on GitHub-hosted runners (Docker available there). Developers do not need local Docker.

on:
  workflow_dispatch:
  push:
    branches: [main, cursor/**]
    paths:
      - "apps/web/**"
      - "services/document-intelligence/**"
      - "packages/shared/**"
      - "packages/authz/**"
      - "infrastructure/docker/**"
      - ".github/workflows/live-ingestion.yml"
      - "scripts/test-live-ci.sh"
      - "scripts/ci/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/web/**"
      - "services/document-intelligence/**"
      - "packages/shared/**"
      - "packages/authz/**"
      - "infrastructure/docker/**"
      - ".github/workflows/live-ingestion.yml"
      - "scripts/test-live-ci.sh"
      - "scripts/ci/**"
      - "pnpm-lock.yaml"

concurrency:
  # Do not cancel in-progress runs: a manual workflow_dispatch on an older SHA
  # was cancelling the push run that contained the MinIO privacy fix.
  group: live-ingestion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-images:
    name: Validate container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List required images (no secrets)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/ci/container-images.env
          echo "Required images:"
          echo "  POSTGRES_IMAGE=${POSTGRES_IMAGE}"
          echo "  REDIS_IMAGE=${REDIS_IMAGE}"
          echo "  MINIO_IMAGE=${MINIO_IMAGE}"
          echo "  MINIO_MC_IMAGE=${MINIO_MC_IMAGE}"
          echo "  CLAMAV_IMAGE=${CLAMAV_IMAGE}"

      - name: Pull each image independently
        run: |
          chmod +x scripts/ci/validate-container-images.sh
          bash scripts/ci/validate-container-images.sh

  live-ingestion:
    name: Live data plane (Postgres/Redis/MinIO/ClamAV/ARQ)
    needs: validate-images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only Postgres/Redis under services: (pulled before steps).
    # MinIO cannot use services: — official image requires `server /data` and GHA
    # cannot pass that command (container exits immediately).
    # MinIO + ClamAV start via scripts/ci/start-live-sidecars.sh (Option B).
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: contractradar
          POSTGRES_PASSWORD: contractradar
          POSTGRES_DB: contractradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractradar -d contractradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      NODE_ENV: test
      APP_ENV: test
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      DOCUMENT_INTELLIGENCE_URL: http://127.0.0.1:8000
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ci-minio-access
      S3_SECRET_ACCESS_KEY: ci-minio-secret-ephemeral
      S3_BUCKET: contractradar-documents
      S3_FORCE_PATH_STYLE: "true"
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      LIVE_INGESTION_TESTS: "true"
      REQUIRE_LIVE_INGESTION_TESTS: "true"
      LIVE_ARQ_WORKER: "true"
      ARQ_QUEUE_NAME: contractradar:document-processing
      ARQ_WORKER_PID_FILE: /tmp/arq-worker.pid
      ARQ_WORKER_LOG: /tmp/arq-worker.log
      LOG_LEVEL: info
      ALLOW_DEV_DEFAULTS: "true"
      UPLOAD_SESSION_TTL_SECONDS: "900"
      DOWNLOAD_URL_TTL_SECONDS: "120"
      REQUIRE_INTEGRATION_DB: "true"
      DATABASE_URL: postgresql://contractradar_app:contractradar@127.0.0.1:5432/contractradar_test?schema=public
      INTEGRATION_DATABASE_URL: postgresql://contractradar_app:contractradar@127.0.0.1:5432/contractradar_test?schema=public
      DATABASE_MIGRATE_URL: postgresql://contractradar:contractradar@127.0.0.1:5432/contractradar_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ephemeral application secrets
        run: |
          set -euo pipefail
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN=$(openssl rand -hex 24)"
            echo "SEED_OWNER_PASSWORD=Ci-Owner-$(openssl rand -hex 8)!"
            echo "SEED_VIEWER_PASSWORD=Ci-Viewer-$(openssl rand -hex 8)!"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MinIO + ClamAV sidecars
        run: |
          set -euo pipefail
          echo "Live ingestion commit: ${GITHUB_SHA}"
          echo "Sidecar script: scripts/ci/start-live-sidecars.sh"
          test -f scripts/ci/start-live-sidecars.sh
          grep -Fq -- '--entrypoint /bin/sh' scripts/ci/start-live-sidecars.sh
          # Fail fast if the pre-fix broken pattern is present.
          if grep -nE 'MINIO_MC_IMAGE\}"[[:space:]]*$' -A2 scripts/ci/start-live-sidecars.sh | grep -qE '[[:space:]]/bin/sh'; then
            echo "ERROR: start-live-sidecars.sh still passes /bin/sh to default mc entrypoint"
            exit 1
          fi
          chmod +x scripts/ci/start-live-sidecars.sh scripts/ci/stop-live-sidecars.sh scripts/ci/sidecar-helpers.sh
          bash scripts/ci/start-live-sidecars.sh

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        working-directory: services/document-intelligence
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Print live job identity
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "short_commit=$(git rev-parse --short HEAD)"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "test_database=contractradar_test"
          echo "ARQ_QUEUE_NAME=${ARQ_QUEUE_NAME}"

      - name: Prisma generate + validate + migrate from zero
        run: |
          set -euo pipefail
          pnpm validate:prisma
          pnpm db:generate
          DATABASE_URL="$DATABASE_MIGRATE_URL" pnpm db:migrate:deploy
          pnpm db:seed
          pnpm --filter @contractradar/web exec prisma migrate status
          chmod +x scripts/ci/assert-live-schema.sh
          bash scripts/ci/assert-live-schema.sh

      - name: Start DI API, ARQ worker, outbox dispatcher
        working-directory: services/document-intelligence
        env:
          APP_ENV: test
          MALWARE_SCANNER: clamav
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"
          ALLOW_DEV_DEFAULTS: "true"
          OUTBOX_POLL_SECONDS: "1"
          ARQ_QUEUE_NAME: contractradar:document-processing
        run: |
          set -euo pipefail
          nohup uvicorn document_intelligence.main:app --host 127.0.0.1 --port 8000 >/tmp/di-api.log 2>&1 &
          echo $! >/tmp/di-api.pid
          nohup arq document_intelligence.workers.WorkerSettings >/tmp/arq-worker.log 2>&1 &
          echo $! >/tmp/arq-worker.pid
          nohup python -m document_intelligence.outbox.dispatcher >/tmp/outbox.log 2>&1 &
          echo $! >/tmp/outbox.pid
          ln -sfn /tmp/outbox.log /tmp/outbox-dispatcher.log
          ln -sfn /tmp/di-api.log /tmp/document-intelligence.log
          sleep 2
          if ! kill -0 "$(cat /tmp/arq-worker.pid)" 2>/dev/null; then
            echo "ERROR: ARQ worker exited immediately after start"
            tail -n 120 /tmp/arq-worker.log || true
            exit 1
          fi
          if ! kill -0 "$(cat /tmp/outbox.pid)" 2>/dev/null; then
            echo "ERROR: outbox dispatcher exited immediately after start"
            tail -n 120 /tmp/outbox.log || true
            exit 1
          fi

      - name: Health-gated service wait
        run: |
          chmod +x scripts/ci/wait-for-live-services.sh scripts/ci/check-arq-worker-ready.sh scripts/ci/check-outbox-dispatcher-ready.sh
          bash scripts/ci/wait-for-live-services.sh
          bash scripts/ci/check-arq-worker-ready.sh
          bash scripts/ci/check-outbox-dispatcher-ready.sh

      - name: Refuse FakeScanner in live workflow
        working-directory: services/document-intelligence
        env:
          APP_ENV: production
          MALWARE_SCANNER: fake_test
          S3_ACCESS_KEY_ID: prod-not-example-key
          S3_SECRET_ACCESS_KEY: prod-not-example-secret
          CLAMAV_HOST: 127.0.0.1
        run: |
          python - <<'PY'
          from document_intelligence.config import Settings, reset_settings_cache
          reset_settings_cache()
          try:
              Settings()  # type: ignore[call-arg]
          except Exception as exc:
              print("OK fake_test refused:", type(exc).__name__)
          else:
              raise SystemExit("FakeScanner/fake_test must be refused outside tests")
          PY

      - name: Run authoritative live suite (fail on skip)
        run: |
          chmod +x scripts/test-live-ci.sh
          bash scripts/test-live-ci.sh

      - name: Sanitize health report artifact
        if: always()
        run: |
          mkdir -p artifacts
          # shellcheck disable=SC1091
          source scripts/ci/sidecar-helpers.sh
          {
            echo "postgres: $(pg_isready -h 127.0.0.1 -U contractradar -d contractradar_test >/dev/null && echo ok || echo error)"
            echo "redis: $(redis-cli -u "$REDIS_URL" ping 2>/dev/null || echo error)"
            echo "minio: $(curl -fsS "$S3_ENDPOINT/minio/health/live" >/dev/null && echo ok || echo error)"
            if docker_container_exists contractradar-ci-clamav; then
              echo "clamav_ping: $(docker exec contractradar-ci-clamav clamdscan --ping 3 >/dev/null 2>&1 && echo ok || echo error)"
            else
              echo "clamav_ping: skipped (container not created)"
            fi
            echo "di_live: $(curl -fsS "$DOCUMENT_INTELLIGENCE_URL/health/live" >/dev/null && echo ok || echo error)"
            echo "sidecar_status:"
            docker ps -a --filter name=contractradar-ci- --format '{{.Names}} {{.Status}} {{.Image}}' 2>/dev/null || true
          } > artifacts/service-health.txt

      - name: Collect sanitized sidecar logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          # shellcheck disable=SC1091
          source scripts/ci/sidecar-helpers.sh
          if docker_container_exists contractradar-ci-minio; then
            safe_docker_logs contractradar-ci-minio 200 > artifacts/minio-sidecar.log
          else
            echo "minio container not created" > artifacts/minio-sidecar.log
          fi
          if docker_container_exists contractradar-ci-clamav; then
            safe_docker_logs contractradar-ci-clamav 200 > artifacts/clamav-sidecar.log
          else
            echo "clamav container not created (startup not reached or skipped)" > artifacts/clamav-sidecar.log
          fi
          tail -n 120 /tmp/di-api.log 2>/dev/null > artifacts/di-api.log || true
          tail -n 120 /tmp/arq-worker.log 2>/dev/null > artifacts/arq-worker.log || true
          tail -n 120 /tmp/outbox.log 2>/dev/null > artifacts/outbox.log || true

      - name: Upload safe diagnostics
        if: always()
        # v6+ runs on Node.js 24 by default (v4/v5 still defaulted to Node 20).
        uses: actions/upload-artifact@v6
        with:
          name: live-ingestion-diagnostics
          path: |
            artifacts/live-summary.json
            artifacts/live-web.log
            artifacts/live-python.log
            artifacts/live-python-junit.xml
            artifacts/service-health.txt
            artifacts/minio-sidecar.log
            artifacts/clamav-sidecar.log
            artifacts/di-api.log
            artifacts/arq-worker.log
            artifacts/outbox.log
          retention-days: 7
          if-no-files-found: warn

      - name: Redact check on uploaded logs
        if: always()
        run: |
          if grep -Eiq 'X-Amz-Signature=|X-Amz-Credential=' artifacts/*.log 2>/dev/null; then
            echo "Potential signed-URL leakage in artifacts"
            exit 1
          fi

      - name: Stop background processes and sidecars
        if: always()
        run: |
          for f in /tmp/di-api.pid /tmp/arq-worker.pid /tmp/outbox.pid; do
            if [[ -f "$f" ]]; then kill "$(cat "$f")" 2>/dev/null || true; fi
          done
          bash scripts/ci/stop-live-sidecars.sh || true
