name: Pilot deployment rehearsal

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: test
  APP_ENV: test
  CONTRACTRADAR_ENV: CI
  CI: 'true'
  PILOT_PREFLIGHT_SYNTHETIC: 'true'
  PILOT_READY_OUT_DIR: ${{ github.workspace }}/artifacts/pilot-readiness
  RELEASE_SHA: ${{ github.sha }}
  DATABASE_URL: postgresql://contractradar_app:contractradar@localhost:5432/contractradar_test?schema=public
  DATABASE_MIGRATE_URL: postgresql://contractradar:contractradar@localhost:5432/contractradar_test?schema=public
  REDIS_URL: redis://localhost:6379
  BETTER_AUTH_SECRET: ci-test-secret-with-sufficient-length-32
  ALLOW_DEV_DEFAULTS: 'true'

jobs:
  pilot-deployment-rehearsal:
    name: Pilot deployment rehearsal (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: contractradar
          POSTGRES_PASSWORD: contractradar
          POSTGRES_DB: contractradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractradar -d contractradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:prisma && pnpm db:generate
      - name: Ensure app DB role exists
        env:
          PGPASSWORD: contractradar
        run: |
          psql -h localhost -U contractradar -d contractradar_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'contractradar_app') THEN
              CREATE ROLE contractradar_app LOGIN PASSWORD 'contractradar';
            END IF;
            GRANT ALL ON SCHEMA public TO contractradar_app;
          END$$;
          SQL
      - name: Synthetic rehearsal
        run: |
          chmod +x scripts/pilot/*.sh scripts/pilot/gh.sh scripts/ci/web-container-runtime-check.sh
          mkdir -p artifacts/pilot-readiness
          node scripts/pilot/platform-ready.mjs || true
          PILOT_PREFLIGHT_SYNTHETIC=true node scripts/pilot/preflight.mjs
          node scripts/pilot/release-manifest.mjs
          bash scripts/pilot/deployment-rehearsal.sh
          test -s artifacts/pilot-readiness/deployment-rehearsal-report.json
          test -s artifacts/pilot-readiness/rollback-report.json
          test -s artifacts/pilot-readiness/incident-rehearsal-report.json
      - name: Evidence summary
        run: |
          node scripts/ci/write-evidence-summary.mjs \
            "Pilot deployment rehearsal" PASS artifacts/pilot-readiness \
            "checksExecuted=platform-ready,preflight-synthetic,migrate-or-not-run,rollback-tabletop,incident-tabletop" \
            "checksNotRun=cloud-deploy,kubernetes,real-tls-edge" \
            "knownGaps=no-real-pilot-traffic"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pilot-deployment-rehearsal-evidence
          path: artifacts/pilot-readiness/
          if-no-files-found: error
