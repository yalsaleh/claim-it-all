name: Backup and restore test

on:
  push:
    branches: [main, cursor/**]
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: test
  APP_ENV: test
  DATABASE_URL: postgresql://contractradar_app:contractradar@localhost:5432/contractradar_test?schema=public
  DATABASE_MIGRATE_URL: postgresql://contractradar:contractradar@localhost:5432/contractradar_test?schema=public
  BETTER_AUTH_SECRET: ci-test-secret-with-sufficient-length-32
  APP_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  DOCUMENT_INTELLIGENCE_URL: http://localhost:8000
  DOCUMENT_INTELLIGENCE_INTERNAL_TOKEN: ci-internal-token-32chars
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: contractradar-documents
  S3_FORCE_PATH_STYLE: 'true'
  ALLOW_DEV_DEFAULTS: 'true'
  MALWARE_SCANNER: fake_test
  BACKUP_OUT_DIR: ${{ github.workspace }}/artifacts/backup

jobs:
  backup-restore:
    name: PostgreSQL + object restore verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: contractradar
          POSTGRES_PASSWORD: contractradar
          POSTGRES_DB: contractradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractradar -d contractradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Start MinIO
        env:
          START_CLAMAV: 'false'
        run: bash scripts/ci/start-live-sidecars.sh
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Migrate + seed
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATE_URL }}
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed
      - name: Run restore test
        run: |
          mkdir -p artifacts/backup
          chmod +x scripts/backup/*.sh
          command -v pg_dump && command -v psql && command -v mc
          bash scripts/backup/restore-test.sh
          test -s artifacts/backup/restore-test-report.json
          test -s artifacts/backup/tenant-isolation-report.json
          test -s artifacts/backup/rls-force-report.json
          test -s artifacts/backup/object-checksum-summary.json
          test -s artifacts/backup/object-manifest.json
          test -s artifacts/backup/backup-manifest.json
          test -s artifacts/backup/database-checksum.txt
          test -s artifacts/backup/database-backup-metadata.json
          test -s artifacts/backup/application-readiness-report.json
          test -s artifacts/backup/object-restore-report.json
          node scripts/ci/write-evidence-summary.mjs \
            "Backup and restore test" PASS artifacts/backup \
            "checksExecuted=pg-backup,object-byte-roundtrip,cross-tenant-isolation,tamper-rejection,readiness" \
            "checksNotRun=production-cloud-restore" \
            "knownGaps=labelled-synthetic-ci-only"
      - uses: actions/upload-artifact@v6
        with:
          name: backup-restore-artifacts
          path: artifacts/backup/
          if-no-files-found: error
      - if: always()
        run: bash scripts/ci/stop-live-sidecars.sh || true
